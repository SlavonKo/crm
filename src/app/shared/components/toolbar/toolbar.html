@if (auth.isAuthenticated()) {
  <mat-toolbar class="toolbar">

    <!-- Logo + nav links -->
    <div class="flex items-center gap-1">
      <mat-icon class="text-indigo-500 mr-1">two_wheeler</mat-icon>
      <span class="font-bold text-sm mr-4 hidden sm:inline">{{ 'navigation.appTitle' | transloco }}</span>

      <a mat-button routerLink="/orders"    routerLinkActive="bg-white/10" class="!rounded-lg">Замовлення</a>
      <a mat-button routerLink="/clients"   routerLinkActive="bg-white/10" class="!rounded-lg">Клієнти</a>
      <a mat-button routerLink="/inventory" routerLinkActive="bg-white/10" class="!rounded-lg">Склад</a>
      <a mat-button routerLink="/calendar"  routerLinkActive="bg-white/10" class="!rounded-lg">Календар</a>
    </div>

    <span class="flex-1"></span>

    <!-- Right side -->
    <div class="flex items-center gap-1">
      <app-theme-switch></app-theme-switch>
      <app-lang-switch></app-lang-switch>

      <!-- User chip + logout -->
      <div class="flex items-center gap-2 ml-2 pl-2 border-l border-slate-200 dark:border-slate-700">
        <span class="text-sm text-slate-500 dark:text-slate-400 hidden md:inline">
          {{ auth.currentUser()?.phoneNumber }}
        </span>
        <button
          mat-icon-button
          (click)="signOut()"
          matTooltip="Вийти"
          aria-label="Вийти з системи"
          class="text-slate-500 hover:text-red-500"
        >
          <mat-icon>logout</mat-icon>
        </button>
      </div>
    </div>

  </mat-toolbar>
}
